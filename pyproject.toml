[project]
name = "watcher-audit"
version = "0.1.0"
description = "Endpoint Audit System: agente de auditoria + repositorio central de evidencias"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9", "watchdog>=4.0"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
windows = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
watcher-agent = "watcher.agent.cli:main"
watcher-server = "watcher.server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
